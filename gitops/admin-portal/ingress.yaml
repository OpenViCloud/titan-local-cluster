apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-portal
spec:
  ingressClassName: traefik
  rules:
    - host: admin.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-portal
                port:
                  number: 80
