apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: titan-staging

# Staging's manifests with dev's own image tag (below) and local hostnames (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/network.md#host-access).
resources:
  - https://github.com/OpenViCloud/titan-ops//gitops/admin-portal/overlays/staging?ref=5b2645543065c7dbe876060b3ec4d2a234a2186a
  - ingress.yaml

patches:
  - path: configmap-patch.yaml

# Dev's own image: a commit OpenViCloud/titan-admin-console published from main. Staging's name and tag move only
# by promotion in titan-ops (https://github.com/OpenViCloud/titan-ops/blob/main/docs/architecture/platform-infra.md#gitops-flow).
images:
  # Matched by the name staging's overlay gives the image, not by the base name.
  - name: ghcr.io/openvicloud/titan-admin-console
    newTag: "91b0e41"
