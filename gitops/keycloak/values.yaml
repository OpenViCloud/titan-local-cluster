# Overrides of base/keycloak/values.yaml for the local cluster (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/topology.md#titan-integration).
# extraEnv is one string in the chart, so the whole list is repeated here; keep it in step with base/keycloak/values.yaml.
extraEnv: |
  - name: KC_DB
    value: "postgres"
  - name: KC_DB_URL_HOST
    value: "titan-db-rw.titan-db-staging.svc.cluster.local"
  - name: KC_DB_URL_PORT
    value: "5432"
  - name: KC_DB_URL_DATABASE
    value: "keycloak_staging"
  - name: KC_DB_USERNAME
    value: "titan"
  - name: KC_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: titan-db-credentials
        key: password
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    value: "admin"
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin-secret
        key: admin-password
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_HTTP_RELATIVE_PATH
    value: "/auth"
  - name: KC_PROXY_HEADERS
    value: "xforwarded"
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_HEALTH_ENABLED
    value: "true"
  # Local cluster: the issuer is fixed to the browser's URL; the back channel answers on whatever host asks
  # (control-plane reads metadata from the service), https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/network.md#host-access.
  - name: KC_HOSTNAME
    value: "http://auth.localhost:8080/auth"
  - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
    value: "true"
  # RAM budget of titan-k3s (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/topology.md#ram-budget).
  - name: JAVA_OPTS_KC_HEAP
    value: "-Xms64m -Xmx320m"

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 640Mi
