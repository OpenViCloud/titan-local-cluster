# The regression runner of base/, pointed at the local cluster (docs/topology.md#secrets):
# the pod reads the generated test-account passwords through secretKeyRef, the agent never sees them.
# Application regression-runner-local syncs it; both CronJobs are suspended, a run is a Job made from one.
# The browser in the pod must reach *.localhost:8080 like the host does, because Keycloak's issuer carries that
# port: a spec starts a loopback proxy on 8080 towards Traefik (lib/local-proxy.ts of titan-regression).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The runner lives beside Keycloak, where the two test-account secrets are.
namespace: titan-auth-dev

resources:
  - ../../base/regression-runner

# The addresses the specs use: the host's (the pod reaches them through the loopback proxy of the header above).
configMapGenerator:
  - name: regression-runner-urls
    literals:
      - PORTAL_BASE_URL=http://portal.localhost:8080
      - ADMIN_BASE_URL=http://admin.localhost:8080
      - API_BASE_URL=http://api.localhost:8080

# One patch for both lanes: the CronJob of lane b (titan-regression-b) differs only in user and password.
patches:
  - target:
      kind: CronJob
      name: titan-regression(-b)?
    patch: |-
      # The control plane's meter tick on dev (control-plane/patch-env.yaml, BillingMeter__IntervalMinutes): the billing
      # specs wait that long for a usage line and price one line by it (lib/meter.ts of titan-regression).
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
        value:
          name: METER_INTERVAL_MINUTES
          value: "1"
      # Node's own HTTP client (the request fixture) resolves through /etc/hosts; Chromium maps *.localhost to
      # loopback by itself.
      - op: add
        path: /spec/jobTemplate/spec/template/spec/hostAliases
        value:
          - ip: 127.0.0.1
            hostnames: [portal.localhost, admin.localhost, api.localhost, auth.localhost]
