apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: titan-staging

# The shared manifests of base/ with dev's own image tag (below) and local hostnames (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/network.md#host-access).
resources:
  - ../../base/cloud-console
  - ingress.yaml

patches:
  - path: configmap-patch.yaml

# Dev's own image: a commit OpenViCloud/titan-cloud-console published from main. Staging's name and tag move only by
# promotion in titan-ops (https://github.com/OpenViCloud/titan-ops/blob/main/docs/architecture/platform-infra.md#gitops-flow).
images:
  # Matched by the name base/cloud-console gives the image (scripts/pull-images.py stops on any other).
  - name: cloud-console
    newName: ghcr.io/openvicloud/titan-cloud-console
    newTag: "6630802"
