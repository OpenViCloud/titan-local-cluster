apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-console
spec:
  ingressClassName: traefik
  rules:
    - host: portal.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-console
                port:
                  number: 80
