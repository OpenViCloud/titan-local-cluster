apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging's worker manifests with dev's own image (below).
resources:
  - https://github.com/OpenViCloud/titan//gitops/incus-worker/overlays/staging?ref=db7a2eb02379f0159923484afbd4c14e0c01e8df

patches:
  - path: patch-no-incus-tunnel.yaml

# Dev's own image: a commit OpenViCloud/incus-worker published from main. Staging's name and tag move only by promotion in
# titan (https://github.com/OpenViCloud/titan/blob/main/docs/architecture/platform-infra.md#gitops-flow).
images:
  # Matched by the name staging's overlay gives the image, not by the base name.
  - name: ghcr.io/openvicloud/titan-incus-worker
    newName: ghcr.io/openvicloud/incus-worker
    newTag: "6b04b88b8a8dcfc6661ae6f42e7b3e5d8b7bc8e2"
