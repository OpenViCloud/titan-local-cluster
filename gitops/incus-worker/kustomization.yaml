apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The shared worker manifests of base/ with dev's own image (below).
namespace: titan-dev

resources:
  - ../../base/incus-worker

patches:
  - path: patch-backup-bucket.yaml

# Dev's own image: a commit OpenViCloud/titan-incus-worker published from main. Staging's name and tag move only by promotion in
# titan-ops (https://github.com/OpenViCloud/titan-ops/blob/main/docs/architecture/platform-infra.md#gitops-flow).
images:
  # Matched by the name base/incus-worker gives the image (scripts/pull-images.py stops on any other).
  - name: incus-worker
    newName: ghcr.io/openvicloud/titan-incus-worker
    newTag: "b112ddae781a66fb49081481b752514612600b53"
