apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The shared worker manifests of base/ with dev's own image (below).
namespace: titan-dev

resources:
  - ../../base/incus-worker

# Command pods and one inventory pod (titan-ops architecture/worker-structure.md#worker-roles). No HPA: local runs without
# metrics-server (docs/topology.md#ram-budget R-2), so two command pods, fixed.
components:
  - ../../base/incus-worker/components/roles

patches:
  - path: patch-backup-bucket.yaml
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: incus-worker
      spec:
        replicas: 2

# Dev's own image: a commit OpenViCloud/titan-incus-worker published from main. Prd's name and tag move only by promotion in
# titan-ops (titan-ops architecture/platform-infra.md#gitops-flow).
images:
  # Matched by the name base/incus-worker gives the image (scripts/pull-images.py stops on any other).
  - name: incus-worker
    newName: ghcr.io/openvicloud/titan-incus-worker
    newTag: "665958a43c49ebdbc3e04ed7b84ba6f1e894c810"
