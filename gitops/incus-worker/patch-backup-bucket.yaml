# Dev's S3 at the endpoint the control plane reads; the optional key-pair Secret (incus-worker-backup-credentials, written by
# mac/scripts/bootstrap-secrets.sh) comes from base/incus-worker. tests/render_test.py holds bucket and endpoint equal to the
# control plane's. Incus uploads, and trusts the CA through titan-incus's system store (mac/scripts/trust-s3-ca.sh); the
# worker itself asks the bucket whether the object arrived, so it gets the CA too, as one more file in /etc/ssl/certs, which
# Go reads whole (the worker read an uploaded backup over TLS on the rebuilt cluster, 2026-10-26).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incus-worker
spec:
  template:
    spec:
      containers:
        - name: incus-worker
          env:
            - name: BACKUP_S3_URL
              value: https://lima-titan-k3s.internal:30833
            - name: BACKUP_S3_BUCKET
              value: titan-backup-dev
          volumeMounts:
            - name: s3-ca
              mountPath: /etc/ssl/certs/titan-local-s3.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: s3-ca
          secret:
            secretName: s3-ca
