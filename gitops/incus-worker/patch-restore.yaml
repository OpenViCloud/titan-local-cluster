# Drill: the restore Job of components/restore for cluster local, with dev's bucket and its CA as patch-backup-bucket.yaml
# gives the worker's Deployment (titan-ops infra/oci/runbook.md#restore-cluster).
apiVersion: batch/v1
kind: Job
metadata:
  name: incus-worker-restore
spec:
  template:
    spec:
      containers:
        - name: incus-worker
          env:
            - name: RESTORE_CLUSTER_ID
              value: local
            - name: BACKUP_S3_URL
              value: https://lima-titan-k3s.internal:30833
            - name: BACKUP_S3_BUCKET
              value: titan-backup-dev
          volumeMounts:
            - name: s3-ca
              mountPath: /etc/ssl/certs/titan-local-s3.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: s3-ca
          secret:
            secretName: s3-ca
