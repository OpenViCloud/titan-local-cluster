apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The shared database of base/ with a smaller memory request: on titan-k3s (measured at 3 GiB, now 4) PostgreSQL uses about 100 MiB, and a
# 512 MiB request only blocks scheduling (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/topology.md#ram-budget). The limit stays.
# The Application ignores /spec/resources, so a running cluster takes this on a manual sync; a new one at creation.
namespace: titan-db-staging

resources:
  - ../../base/titan-db

# Continuous backup to dev's S3 (SeaweedFS, gitops/seaweedfs), through base's component (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/oci/architecture.md#backup-bucket):
# the key pair is the Secret titan-db-backup-credentials and the CA the Secret s3-ca, both from mac/scripts/bootstrap-secrets.sh.
# tests/render_test.py holds the bucket and endpoint equal to the control plane's BackupTarget env.
components:
  - ../../base/titan-db/components/backup
  # titan-k3s was rebuilt on a bucket that holds titan-db's archive (the data outlives the VM on the Mac), so the cluster is
  # created from it and archives under titan-db-restored, the component's names. It stays: without it the cluster would
  # archive under titan-db again, and barman refuses that non-empty archive. The next rebuild moves both names
  # (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/topology.md#runbook).
  - ../../base/titan-db/components/restore

patches:
  - target:
      kind: ObjectStore
      name: titan-db-backup
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://titan-backup-dev/postgres/
      - op: replace
        path: /spec/configuration/endpointURL
        value: https://lima-titan-k3s.internal:30833
      - op: add
        path: /spec/configuration/endpointCA
        value:
          name: s3-ca
          key: ca.crt
  - target:
      kind: Cluster
      name: titan-db
    patch: |-
      - op: replace
        path: /spec/resources/requests/memory
        value: 256Mi
  # Integration tests on the Mac create and drop throwaway databases here instead of in a Docker container
  # (test-all.sh of OpenViCloud/titan-control-plane). Dev only: staging has no such role. Password: Secret titan-it-credentials,
  # written by mac/scripts/bootstrap-secrets.sh.
  - target:
      kind: Cluster
      name: titan-db
    patch: |-
      - op: add
        path: /spec/managed
        value:
          roles:
            # connectionLimit and inherit are CNPG's defaults, written out: left implicit, ArgoCD diffs the
            # defaulted live object against this and keeps the app OutOfSync, which blocks promotion.
            - name: titan_it
              ensure: present
              login: true
              createdb: true
              connectionLimit: -1
              inherit: true
              passwordSecret:
                name: titan-it-credentials
