apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The shared database of base/ with a smaller memory request: on titan-k3s (measured at 3 GiB, now 4) PostgreSQL uses about 100 MiB, and a
# 512 MiB request only blocks scheduling (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/topology.md#ram-budget). The limit stays.
# The Application ignores /spec/resources in its diff, so a running cluster takes this with the app's next sync; a new one at creation.
namespace: titan-db-dev

resources:
  - ../../base/titan-db

# Continuous backup to dev's S3 (SeaweedFS, gitops/seaweedfs), through base's component (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/oci/architecture.md#backup-bucket):
# the key pair is the Secret titan-db-backup-credentials and the CA the Secret s3-ca, both from lima/scripts/bootstrap-secrets.sh.
# tests/render_test.py holds the bucket and endpoint equal to the control plane's BackupTarget env.
components:
  - ../../base/titan-db/components/backup
  # The move to namespace titan-db-dev (2026-10-28) is a restore from the archive the cluster in titan-db-staging wrote
  # under titan-db-restored; the restored cluster archives under titan-db-dev. Once it is healthy the restore component
  # goes and the write name stays (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/topology.md#runbook).
  - ../../base/titan-db/components/restore

patches:
  - target:
      kind: ObjectStore
      name: titan-db-backup
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://titan-backup-dev/postgres/
      - op: replace
        path: /spec/configuration/endpointURL
        value: https://lima-titan-k3s.internal:30833
      - op: add
        path: /spec/configuration/endpointCA
        value:
          name: s3-ca
          key: ca.crt
  - target:
      kind: Cluster
      name: titan-db
    patch: |-
      - op: replace
        path: /spec/resources/requests/memory
        value: 256Mi
  # The two names of the restore: read titan-db-restored, the archive of the cluster before the move; write titan-db-dev, a
  # new one, since barman refuses a non-empty archive (base/titan-db/components/restore).
  - target:
      kind: Cluster
      name: titan-db
    patch: |-
      - op: replace
        path: /spec/externalClusters/0/plugin/parameters/serverName
        value: titan-db-restored
      - op: add
        path: /spec/plugins/0/parameters/serverName
        value: titan-db-dev
  # Integration tests on the dev machine create and drop throwaway databases here instead of in a Docker container
  # (test-all.sh of OpenViCloud/titan-control-plane). Dev only: staging has no such role. Password: Secret titan-it-credentials,
  # written by lima/scripts/bootstrap-secrets.sh.
  - target:
      kind: Cluster
      name: titan-db
    patch: |-
      - op: add
        path: /spec/managed
        value:
          roles:
            # connectionLimit and inherit are CNPG's defaults, written out: left implicit, ArgoCD diffs the
            # defaulted live object against this and keeps the app OutOfSync, which blocks promotion.
            - name: titan_it
              ensure: present
              login: true
              createdb: true
              connectionLimit: -1
              inherit: true
              passwordSecret:
                name: titan-it-credentials
