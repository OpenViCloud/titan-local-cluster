apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging's database with a smaller memory request: on titan-k3s (measured at 3 GiB, now 4) PostgreSQL uses about 100 MiB, and a
# 512 MiB request only blocks scheduling (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/topology.md#ram-budget). The limit stays.
# The Application ignores /spec/resources, so a running cluster takes this on a manual sync; a new one at creation.
resources:
  - https://github.com/OpenViCloud/titan-ops//gitops/titan-db/overlays/staging?ref=4bb06db89be212d0ba729f02286dfdfe4aa8b1b8

# Continuous backup to dev's own bucket, through titan-ops's component (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/oci/architecture.md#backup-bucket):
# the key pair is the Secret titan-db-backup-credentials that mac/scripts/bootstrap-secrets.sh writes. tests/render_test.py holds
# the bucket and endpoint equal to the control plane's BackupTarget env.
components:
  - https://github.com/OpenViCloud/titan-ops//gitops/titan-db/components/backup?ref=4bb06db89be212d0ba729f02286dfdfe4aa8b1b8
  # Dev's cluster is created from the bucket (titan-db's archive) and archives under titan-db-restored. It stays: without it the
  # cluster would archive under titan-db again, and barman refuses that non-empty archive. A cluster created again later must move
  # both names, read titan-db-restored and write a new one, or it restores from the stale archive without an error
  # (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/oci/runbook.md#disaster-recovery).
  - https://github.com/OpenViCloud/titan-ops//gitops/titan-db/components/restore?ref=4bb06db89be212d0ba729f02286dfdfe4aa8b1b8

patches:
  - target:
      kind: ObjectStore
      name: titan-db-backup
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://titan-backup-dev/postgres/
  - target:
      kind: Cluster
      name: titan-db
    patch: |-
      - op: replace
        path: /spec/resources/requests/memory
        value: 256Mi
  # Integration tests on the Mac create and drop throwaway databases here instead of in a Docker container
  # (test-all.sh of OpenViCloud/titan-control-plane). Dev only: staging has no such role. Password: Secret titan-it-credentials,
  # written by mac/scripts/bootstrap-secrets.sh.
  - target:
      kind: Cluster
      name: titan-db
    patch: |-
      - op: add
        path: /spec/managed
        value:
          roles:
            # connectionLimit and inherit are CNPG's defaults, written out: left implicit, ArgoCD diffs the
            # defaulted live object against this and keeps the app OutOfSync, which blocks promotion.
            - name: titan_it
              ensure: present
              login: true
              createdb: true
              connectionLimit: -1
              inherit: true
              passwordSecret:
                name: titan-it-credentials
