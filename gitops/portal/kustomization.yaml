apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: titan-staging

# Staging's manifests with dev's own image tag (below) and local hostnames (https://github.com/OpenViCloud/titan/blob/main/docs/infra/environments/local-cluster/network.md#host-access).
resources:
  - https://github.com/OpenViCloud/titan//gitops/portal/overlays/staging?ref=ebdbb5d2669cff1725d5fcbc96e653f56d25bcf2
  - ingress.yaml

patches:
  - path: configmap-patch.yaml

# Dev's own image: a commit OpenViCloud/titan-cloud-console published from main. Staging's name and tag move only by
# promotion in titan (https://github.com/OpenViCloud/titan/blob/main/docs/architecture/platform-infra.md#gitops-flow).
images:
  # Matched by the name staging's overlay gives the image, not by the base name.
  - name: ghcr.io/openvicloud/titan-portal
    newName: ghcr.io/openvicloud/titan-cloud-console
    newTag: "79e86be"
