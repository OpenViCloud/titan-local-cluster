apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  template:
    spec:
      containers:
        - name: control-plane
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Staging
            # Dev's S3, SeaweedFS of gitops/seaweedfs, over TLS with the CA of lima/scripts/bootstrap-secrets.sh (patch-s3-ca.yaml);
            # the key pair is the Secret control-plane-backup-credentials that the same script writes. SeaweedFS ignores
            # the region, the S3 client needs one.
            - name: BackupTarget__Endpoint
              value: https://lima-titan-k3s.internal:30833
            - name: BackupTarget__Region
              value: us-east-1
            - name: BackupTarget__Bucket
              value: titan-backup-dev
            - name: Keycloak__Authority
              value: http://auth.localhost:8080/auth/realms/titan
            # The browser's issuer, auth.localhost, does not resolve inside the cluster: the bearer handler reads
            # the metadata from Keycloak's service instead, over http (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/network.md#host-access).
            - name: Authentication__Schemes__Bearer__MetadataAddress
              value: http://keycloak-http.titan-auth-dev.svc.cluster.local/auth/realms/titan/.well-known/openid-configuration
            - name: Authentication__Schemes__Bearer__RequireHttpsMetadata
              value: "false"
            - name: Authentication__Schemes__Bearer__ValidIssuers__0
              value: http://auth.localhost:8080/auth/realms/titan
            - name: Cors__AllowedOrigins__0
              value: http://portal.localhost:8080
            - name: Cors__AllowedOrigins__1
              value: http://admin.localhost:8080
            - name: Cors__AllowedOrigins__2
              value: http://site.localhost:8080
