apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: titan-dev

# The local cluster runs the shared manifests of base/ with its own image (below), hostnames, cluster list
# and token issuer (docs/topology.md#titan-integration).
resources:
  - ../../base/control-plane
  - ingress.yaml
  - rename-cluster-id-job.yaml

configMapGenerator:
  - name: control-plane-clusters
    literals:
      # Cluster local is titan-incus. Its server fingerprint changes when the VM is rebuilt, so it comes with Titan's
      # client identity from Secret control-plane-cluster (lima/scripts/join-cluster.sh). The endpoint here is macOS's:
      # the script writes this host's into that Secret, which comes later in the control plane's envFrom and wins.
      - Clusters__0__Id=local
      - Clusters__0__Name=Local
      - Clusters__0__Endpoint=https://192.168.104.1:8443
      - Clusters__0__OvnUplinkNetwork=ovnup
      - Clusters__0__StoragePool=default
      # The /56 that lima/provision/incus.sh routes on ovnup. Without it a network that asks for public IPv6 answers 422,
      # so no load balancer can be made.
      - Clusters__0__Ipv6Block=2001:db8:0:d400::/56

patches:
  - path: patch-env.yaml
  - path: patch-s3-ca.yaml
  # Local runs without metrics-server (docs/topology.md#ram-budget R-2): base's HPA could never read CPU and ArgoCD would
  # mark the app Degraded. Local drops it and runs the two pods the HPA keeps at least.
  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: control-plane
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: control-plane
      spec:
        replicas: 2

# Dev's own image: a commit OpenViCloud/titan-control-plane published from main. Prd's name and tag move only by promotion in
# titan-ops (titan-ops architecture/platform-infra.md#gitops-flow).
images:
  # Matched by the name base/control-plane gives the image (scripts/pull-images.py stops on any other).
  - name: control-plane
    newName: ghcr.io/openvicloud/titan-control-plane
    newTag: "7f10bc3"
