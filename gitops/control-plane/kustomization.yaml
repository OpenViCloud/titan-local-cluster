apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: titan-staging

# The local cluster runs the shared manifests of base/ with its own image (below), hostnames, cluster list
# and token issuer (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/topology.md#titan-integration).
resources:
  - ../../base/control-plane
  - ingress.yaml

configMapGenerator:
  - name: control-plane-zones
    literals:
      # Cluster local-mac is titan-incus. Its server fingerprint changes when the VM is rebuilt, so it comes with Titan's
      # client identity from Secret control-plane-cluster (lima/scripts/join-cluster.sh). The endpoint here is macOS's:
      # the script writes this host's into that Secret, which comes later in the control plane's envFrom and wins.
      - Clusters__0__Id=local-mac
      - Clusters__0__Name=Local Mac
      - Clusters__0__Endpoint=https://192.168.104.1:8443
      - Clusters__0__OvnUplinkNetwork=ovnup
      - Clusters__0__StoragePool=default

patches:
  - path: patch-env.yaml
  - path: patch-s3-ca.yaml

# Dev's own image: a commit OpenViCloud/titan-control-plane published from main. Staging's name and tag move only by promotion in
# titan-ops (https://github.com/OpenViCloud/titan-ops/blob/main/docs/architecture/platform-infra.md#gitops-flow).
images:
  # Matched by the name base/control-plane gives the image (scripts/pull-images.py stops on any other).
  - name: control-plane
    newName: ghcr.io/openvicloud/titan-control-plane
    newTag: "1bd8aa2"
