apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: titan-staging

# The local cluster on the Mac runs staging's manifests with its own image (below); the hostnames, the zone list
# and the token issuer change (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/topology.md#titan-integration).
resources:
  - https://github.com/OpenViCloud/titan-ops//gitops/control-plane/overlays/staging?ref=3f65c6f3b6ff7047da03632b4d6c051970861d53
  - ingress.yaml

configMapGenerator:
  - name: control-plane-zones
    behavior: replace
    literals:
      - Zones__0__Id=local-mac
      - Zones__0__Name=Local Mac

patches:
  - path: patch-env.yaml
  - path: patch-no-incus-tunnel.yaml

# Dev's own image: a commit OpenViCloud/titan-control-plane published from main. Staging's name and tag move only by promotion in
# titan-ops (https://github.com/OpenViCloud/titan-ops/blob/main/docs/architecture/platform-infra.md#gitops-flow).
images:
  # Matched by the name staging's overlay gives the image, not by the base name.
  - name: ghcr.io/openvicloud/titan-control-plane
    newTag: "a328cdf"
