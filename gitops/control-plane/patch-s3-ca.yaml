# The CA of dev's S3 as one more file in the system store, so the image's own CAs stay: .NET reads every file in
# /etc/ssl/certs (the Backups page's Test connected on the rebuilt cluster, 2026-10-26). Secret s3-ca comes from lima/scripts/bootstrap-secrets.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  template:
    spec:
      containers:
        - name: control-plane
          volumeMounts:
            - name: s3-ca
              mountPath: /etc/ssl/certs/titan-local-s3.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: s3-ca
          secret:
            secretName: s3-ca
