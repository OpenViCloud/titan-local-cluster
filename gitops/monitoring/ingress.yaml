# VictoriaMetrics (vmui and its whole API), with no sign-in.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victoria-metrics
spec:
  ingressClassName: traefik
  rules:
    - host: metrics.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: victoria-metrics
                port:
                  number: 8428
