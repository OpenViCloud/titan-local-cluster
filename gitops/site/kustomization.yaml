apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: titan-staging

# Staging's manifests with dev's own image tag (below) and local hostnames (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/network.md#host-access).
resources:
  - https://github.com/OpenViCloud/titan-ops//gitops/site/overlays/staging?ref=cbfdde84d794ff15395fc90f5f6c82f11018b9b1
  - ingress.yaml

patches:
  - path: configmap-patch.yaml

# Dev's own image: a commit OpenViCloud/titan-landing published from main. Staging's name and tag move only by
# promotion in titan-ops (https://github.com/OpenViCloud/titan-ops/blob/main/docs/architecture/platform-infra.md#gitops-flow).
images:
  # Matched by the name staging's overlay gives the image, not by the base name.
  - name: ghcr.io/openvicloud/titan-site
    newName: ghcr.io/openvicloud/titan-landing
    newTag: "48450ad"
