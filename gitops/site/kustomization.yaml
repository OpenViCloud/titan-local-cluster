apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: titan-dev

# The shared manifests of base/ with dev's own image tag (below) and local hostnames (docs/network.md#host-access).
resources:
  - ../../base/site
  - ingress.yaml

patches:
  - path: configmap-patch.yaml
  # Local runs without metrics-server (docs/topology.md#ram-budget R-2): base's HPA could never read CPU and ArgoCD would
  # mark the app Degraded, so local drops it.
  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: site

# Dev's own image: a commit OpenViCloud/titan-landing published from main. Prd's name and tag move only by
# promotion in titan-ops (titan-ops architecture/platform-infra.md#gitops-flow).
images:
  # Matched by the name base/site gives the image (scripts/pull-images.py stops on any other).
  - name: site
    newName: ghcr.io/openvicloud/titan-landing
    newTag: "bf95791"
