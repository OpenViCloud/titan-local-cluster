# Local cluster on the Mac: copy of titan-ops's gitops/apps-staging/cnpg-operator.yaml (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/topology.md#titan-integration).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    # Cluster-scoped: before titan-db (sync-wave -1)
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: "0.25.0"  # min for managed.roles+passwordSecret (1.24) and Database CRD (1.25)
      helm:
        valueFiles:
          - $values/gitops/cnpg/operator-values.yaml
    - repoURL: https://github.com/OpenViCloud/titan-ops
      targetRevision: dc3d9697471d0e23ae8b61e3cadd273031b665c2
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system


  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
