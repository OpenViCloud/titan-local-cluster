# Local cluster on the Mac: copy of titan-ops's gitops/apps-staging/titan-db.yaml with dev's overlay from this repository (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/topology.md#titan-integration).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: titan-db-local-mac
  namespace: argocd
  annotations:
    # Deploy after cnpg-operator (wave -1): its CRDs must exist first
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/OpenViCloud/titan-local-cluster
    targetRevision: main
    path: gitops/titan-db
  destination:
    server: https://kubernetes.default.svc
    namespace: titan-db-staging
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /spec/postgresql/parameters/max_connections
        - /spec/resources
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
