# Local cluster on the Mac: copy of titan-ops's gitops/apps-staging/keycloak.yaml with dev's values and ingress from this repository, and one source more: the second regression test user, realm-import-beta-user-2 (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/environments/local-cluster/topology.md#titan-integration).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-local-mac
  namespace: argocd
  annotations:
    # wave 1, after titan-db (wave 0): the keycloak_staging database must exist first
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://codecentric.github.io/helm-charts
      chart: keycloakx
      targetRevision: "7.1.9"
      helm:
        releaseName: keycloak
        valueFiles:
          - $values/gitops/keycloak/staging-values.yaml
          - $local/gitops/keycloak/values.yaml
    - repoURL: https://github.com/OpenViCloud/titan-ops
      targetRevision: 5b4872dddb4eb647e869eff35fd3d550a8cd7ddb
      ref: values
    - repoURL: https://github.com/OpenViCloud/titan-local-cluster
      targetRevision: main
      ref: local
    - repoURL: https://github.com/OpenViCloud/titan-ops
      targetRevision: 5b4872dddb4eb647e869eff35fd3d550a8cd7ddb
      path: gitops/keycloak/realm-import
    # Not in staging's app until release:infra has made its Secret: the hook of this directory reads Secret
    # beta-user-2-credentials, which mac/scripts/bootstrap-secrets.sh makes here. Run that script (up.sh does) before the
    # push that adds this source reaches a cluster that has no such Secret, or the hook pod never starts.
    - repoURL: https://github.com/OpenViCloud/titan-ops
      targetRevision: 5b4872dddb4eb647e869eff35fd3d550a8cd7ddb
      path: gitops/keycloak/realm-import-beta-user-2
    - repoURL: https://github.com/OpenViCloud/titan-local-cluster
      targetRevision: main
      path: gitops/keycloak/ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: titan-auth-staging
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
