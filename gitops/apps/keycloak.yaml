# Local cluster: copy of titan-ops's gitops/apps-staging/keycloak.yaml with dev's values, realm origins (gitops/keycloak/realm-import) and ingress from this repository, and one source more: the second regression test user, realm-import-beta-user-2 (docs/topology.md#titan-integration).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-local
  namespace: argocd
  annotations:
    # wave 1, after titan-db (wave 0): titan-db is Healthy once Database keycloak is applied (its health check in
    # lima/provision/k3s.sh), so the database exists before Keycloak starts
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://codecentric.github.io/helm-charts
      chart: keycloakx
      targetRevision: "7.1.9"
      helm:
        releaseName: keycloak
        valueFiles:
          - $local/base/keycloak/values.yaml
          - $local/gitops/keycloak/values.yaml
    - repoURL: https://github.com/OpenViCloud/titan-local-cluster
      targetRevision: main
      ref: local
    - repoURL: https://github.com/OpenViCloud/titan-local-cluster
      targetRevision: main
      path: gitops/keycloak/realm-import
    # Not in staging's app until release:infra has made its Secret: the hook of this directory reads Secret
    # beta-user-2-credentials, which lima/scripts/bootstrap-secrets.sh makes here. Run that script (up.sh does) before the
    # push that adds this source reaches a cluster that has no such Secret, or the hook pod never starts.
    - repoURL: https://github.com/OpenViCloud/titan-local-cluster
      targetRevision: main
      path: base/keycloak/realm-import-beta-user-2
    - repoURL: https://github.com/OpenViCloud/titan-local-cluster
      targetRevision: main
      path: gitops/keycloak/ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: titan-auth-dev
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
