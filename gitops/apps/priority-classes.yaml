# Local cluster's Application for base/priority-classes; prd's comes in titan-ops with the release that moves its pin
# past this base (docs/topology.md#titan-integration).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: priority-classes-local
  namespace: argocd
  annotations:
    # Cluster-scoped and first: a pod that names a priority the cluster does not have is refused.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/OpenViCloud/titan-local-cluster
    targetRevision: main
    path: gitops/priority-classes
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
