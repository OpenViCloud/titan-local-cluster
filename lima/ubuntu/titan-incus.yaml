# titan-incus: the Incus node of the local cluster on Ubuntu (docs/topology.md#layout).
# Guest VMs run as KVM inside this VM, so the host's KVM must allow nesting (kvm_intel nested=Y, kvm_amd nested=1).
#   limactl create --name titan-incus lima/ubuntu/titan-incus.yaml
# Debian 13, the OS of the staging machine singapore01 (titan-ops infra/incus/user-stories.md#us-incus-singapore01-01).
# template:_images/, not template:debian-13: the latter also mounts the user's home into the VM.
base: template:_images/debian-13
vmType: qemu
cpus: 4
memory: 7GiB
disk: 60GiB
mounts: []
containerd:
  system: false
  user: false
# No user-v2: QEMU aborts under load on its socket NIC. titan-k3s reaches the Incus API, and this VM reaches
# SeaweedFS, through the host's 127.0.0.1 (docs/network.md#vm-to-vm).
hostResolver:
  hosts:
    lima-titan-k3s.internal: 192.168.5.2
# The Incus API listens on this VM's default-route address (lima/provision/incus.sh); only the host's loopback gets it.
portForwards:
- guestIP: 192.168.5.15
  guestPort: 8443
  hostIP: 127.0.0.1
  hostPort: 8443
- guestPortRange: [1, 65535]
  proto: any
  ignore: true
provision:
- mode: system
  file:
    url: provision/incus.sh
