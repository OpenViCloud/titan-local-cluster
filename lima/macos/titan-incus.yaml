# titan-incus: the Incus node of the local cluster (docs/topology.md#layout).
# Guest VMs run as KVM inside this VM, so it needs nested virtualization (Apple M3 or later).
#   limactl create --name titan-incus lima/macos/titan-incus.yaml
# Debian 13, the OS of the staging machine singapore01 (titan-ops infra/incus/user-stories.md#us-incus-singapore01-01).
base: template://debian-13
vmType: vz
nestedVirtualization: true
cpus: 4
# A ceiling, not a reservation: macOS backs only the pages the guest touches.
memory: 7GiB
disk: 60GiB
mounts: []
containerd:
  system: false
  user: false
# user-v2 lets titan-k3s reach the Incus API (docs/network.md#vm-to-vm).
networks:
- lima: user-v2
# Nothing reaches the Mac: the Incus API is root on every guest VM.
portForwards:
- guestPortRange: [1, 65535]
  proto: any
  ignore: true
provision:
- mode: system
  file:
    url: provision/incus.sh
