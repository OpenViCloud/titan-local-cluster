# Only what the worker's commands use: read the nodes and the images their kubelets report, and run the pull pods in its
# own namespace (function-runtime.sync, function.deploy); write a tenant's namespace and what isolates it (template 1), a
# version's Secret and a function's Knative Service (template 2), and read the Service's revisions (function.deploy,
# function.delete, the reconciler). Tenant namespaces are made on the fly, so those rules are cluster-wide
# (titan-ops features/ovc-function/design.md#k8s-templates). Each new command adds its own rule here.
apiVersion: v1
kind: ServiceAccount
metadata: {name: function-worker, namespace: titan-function-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: titan-function-worker}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  # Server-side apply is one PATCH: create when the object is missing, patch when it is there; the worker never reads
  # these back, so no get (none on Secrets above all).
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [serviceaccounts, resourcequotas, limitranges]
    verbs: [create, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, patch]
  # deletecollection: a function's Secrets go by label when it is deleted.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, patch, deletecollection]
  - apiGroups: [serving.knative.dev]
    resources: [services]
    verbs: [get, create, patch, delete]
  - apiGroups: [serving.knative.dev]
    resources: [revisions]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: titan-function-worker}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: titan-function-worker}
subjects:
  - {kind: ServiceAccount, name: function-worker, namespace: titan-function-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: function-worker-pulls, namespace: titan-function-system}
rules:
  - apiGroups: [""]
    resources: [pods]
    # create and patch: server-side apply of a pull pod; get: its phase; deletecollection: the pull pods of a runtime or of a function version.
    verbs: [get, create, patch, deletecollection]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: function-worker-pulls, namespace: titan-function-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: function-worker-pulls}
subjects:
  - {kind: ServiceAccount, name: function-worker, namespace: titan-function-system}
