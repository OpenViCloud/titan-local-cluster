# One worker: it runs the reconciler of this cluster, and two would report each runtime twice (Recreate, so a rollout
# never runs two). On the node's own network: the dev control plane is reachable only at the host's 127.0.0.1:8080,
# where Lima forwards titan-k3s's ingress, as api.localhost (docs/network.md); hostAliases pins that name in the pod's
# /etc/hosts. /healthz listens on every interface of the host: the kubelet probes the node's address.
apiVersion: apps/v1
kind: Deployment
metadata: {name: function-worker, namespace: titan-function-system}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: function-worker}}
  template:
    metadata: {labels: {app: function-worker}}
    spec:
      serviceAccountName: function-worker
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostAliases:
        - {ip: 127.0.0.1, hostnames: [api.localhost]}
      containers:
        - name: function-worker
          # OpenViCloud/titan-function-worker@e31bff1 (main), the digest its CI printed.
          image: ghcr.io/openvicloud/titan-function-worker@sha256:7bee4e41dbd06170b680003d1fa15702c47661d25daf9d6ca74552420bbcfaa3
          env:
            - {name: CP_BASE_URL, value: "http://api.localhost:8080"}
            - {name: FUNCTION_CLUSTER_ID, value: local-function}
            - {name: HEALTH_ADDR, value: "0.0.0.0:10390"}
            # The ranges a tenant's pod may not reach (template 1's tenant-egress): pods and services of function/host/install.sh
            # (dual stack), and the host's networks. The IPv6 /64 is the one the LAN's router hands out (SLAAC, read with
            # `ip -6 addr` on 2026-11-28): if the router's prefix changes, this line must follow it, or the API server and
            # the kubelet answer a tenant's pod on the host's new IPv6 address.
            - {name: POD_CIDRS, value: "10.42.0.0/16,fd42:42::/56"}
            - {name: SERVICE_CIDRS, value: "10.43.0.0/16,fd43:43::/112"}
            - {name: NODE_CIDRS, value: "192.168.0.0/24,2001:ee0:4f02:4960::/64"}
          envFrom:
            - secretRef: {name: function-worker-secrets}
          livenessProbe:
            httpGet: {path: /healthz, port: 10390}
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
