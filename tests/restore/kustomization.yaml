apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# base/titan-db with backup and restore, as the overlay of an environment being rebuilt has them
# (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/oci/runbook.md#disaster-recovery). Rendered by
# tests/render_test.py only: no Application points here.
resources:
  - ../../base/titan-db

components:
  - ../../base/titan-db/components/backup
  - ../../base/titan-db/components/restore
