apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# The worker as two Deployments of one image (titan-ops architecture/worker-structure.md#worker-roles): incus-worker
# leases the customers' commands and backups, as many pods as there are; incus-worker-inventory reads the clusters
# (reconciler and VM metrics), one pod, replaced only after the old one stopped, so no cluster is read twice per cycle.
resources:
  - deployment-inventory.yaml

patches:
  - target:
      kind: Deployment
      name: incus-worker
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: WORKER_ROLE
          value: commands
