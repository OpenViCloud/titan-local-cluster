apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: incus-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: incus-worker
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
