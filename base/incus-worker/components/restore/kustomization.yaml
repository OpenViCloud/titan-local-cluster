apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Rebuilds one Incus cluster on a reinstalled host from the backup bucket (titan-ops features/backup/design.md#cluster-restore).
# The Job starts as soon as the overlay has it, so add it only once the host is reinstalled, beside components/workers-stopped
# (added when the host was lost), with a patch that sets RESTORE_CLUSTER_ID of the Job (and, for a bucket over a private
# CA, the same endpoint, bucket and CA mounts the worker's Deployment has). Remove both once the Job succeeded; the
# workers start again.
resources:
  - job.yaml
