# The worker's restore role, once: it exits 0 when every resource came back, 1 otherwise (its log names each failure).
# Never retried by Kubernetes: a second run on a half-restored host meets what the first one made.
apiVersion: batch/v1
kind: Job
metadata:
  name: incus-worker-restore
spec:
  backoffLimit: 0
  # A whole cluster's archives go through one request each; the bound is the deadline, not a request timeout.
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        app: incus-worker-restore
    spec:
      restartPolicy: Never
      priorityClassName: titan-platform
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: incus-worker
          image: incus-worker:latest
          # CP_INTERNAL_TOKEN from worker-secrets; the bucket's key pair is required here, unlike the Deployment's.
          envFrom:
            - secretRef:
                name: worker-secrets
            - secretRef:
                name: incus-worker-backup-credentials
          env:
            - name: CP_BASE_URL
              value: http://control-plane:80
            - name: WORKER_ROLE
              value: restore
            # The overlay sets the cluster to restore.
            - name: RESTORE_CLUSTER_ID
              value: ""
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
