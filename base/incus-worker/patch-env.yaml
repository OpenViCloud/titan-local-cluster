# What every environment's worker runs with; each overlay adds its backup endpoint and bucket.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incus-worker
spec:
  template:
    spec:
      containers:
        - name: incus-worker
          # The patch replaces the whole envFrom list of deployment.yaml, so worker-secrets (CP_INTERNAL_TOKEN) is listed again.
          envFrom:
            - secretRef:
                name: worker-secrets
            # BACKUP_S3_ACCESS_KEY_ID and BACKUP_S3_SECRET_ACCESS_KEY; optional so the worker starts before the Secret exists
            # (titan-ops features/backup/design.md#incus-backup).
            - secretRef:
                name: incus-worker-backup-credentials
                optional: true
          env:
            # The worker runs in the control plane's namespace, so the Service's short name reaches it.
            - name: CP_BASE_URL
              value: http://control-plane:80
