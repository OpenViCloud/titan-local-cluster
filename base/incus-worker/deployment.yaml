apiVersion: apps/v1
kind: Deployment
metadata:
  name: incus-worker
spec:
  # One replica that runs every loop (WORKER_ROLE all): two would each lease commands, which is safe
  # (titan-ops architecture/provider-and-worker.md#provider-command-lease), but run every reconciler twice. An overlay
  # that takes components/roles splits it into command pods and one inventory pod (titan-ops
  # architecture/worker-structure.md#worker-roles); components/autoscale then lets an HPA own the command pods' count.
  replicas: 1
  selector:
    matchLabels:
      app: incus-worker
  template:
    metadata:
      labels:
        app: incus-worker
    spec:
      priorityClassName: titan-platform
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: incus-worker
          image: incus-worker:latest
          ports:
            - name: health
              containerPort: 8080
          # CP_INTERNAL_TOKEN comes from worker-secrets.
          envFrom:
            - secretRef:
                name: worker-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          # template.sync streams the distro's image (~700 MB) to a temporary file before the upload, never into
          # memory (titan-ops features/catalog/design.md#template-is-an-image-alias).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
