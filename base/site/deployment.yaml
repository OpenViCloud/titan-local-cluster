apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
spec:
  # No replicas: hpa.yaml owns the count (titan-ops architecture/platform-infra.md#pod-priority).
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      priorityClassName: titan-platform
      imagePullSecrets:
        - name: ghcr-credentials
      volumes:
        - name: site-config
          configMap:
            name: site-config
      containers:
        - name: site
          image: site:latest
          ports:
            - containerPort: 80
          volumeMounts:
            # Runtime config, not baked: one image serves every environment (titan-ops features/public-site/design.md#runtime-config).
            - name: site-config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          # nginx serving files uses 4–12 MiB (measured on dev 2026-11-12); the HPA measures CPU against the request.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
