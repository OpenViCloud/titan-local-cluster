apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      volumes:
        - name: site-config
          configMap:
            name: site-config
      containers:
        - name: site
          image: site:latest
          ports:
            - containerPort: 80
          volumeMounts:
            # Runtime config, not baked: one image serves every environment (titan-ops features/public-site/design.md#runtime-config).
            - name: site-config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
