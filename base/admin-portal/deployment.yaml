apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-portal
spec:
  # No replicas: hpa.yaml owns the count (titan-ops architecture/platform-infra.md#pod-priority).
  selector:
    matchLabels:
      app: admin-portal
  template:
    metadata:
      labels:
        app: admin-portal
    spec:
      priorityClassName: titan-platform
      imagePullSecrets:
        - name: ghcr-credentials
      volumes:
        - name: admin-portal-config
          configMap:
            name: admin-portal-config
      containers:
        - name: admin-portal
          image: admin-portal:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: admin-portal-config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          # nginx serving files uses 4–12 MiB (measured on dev 2026-11-12); the HPA measures CPU against the request.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
