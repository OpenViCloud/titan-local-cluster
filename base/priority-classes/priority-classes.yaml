# The apps customers depend on: scheduled first, and never preempted by the runner. They do not preempt either: the
# database, the tunnel and ArgoCD have no class yet, so a pod of this class could otherwise push them off the node.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: titan-platform
value: 1000000
globalDefault: false
preemptionPolicy: Never
description: Titan's apps that serve customers (identity, control plane, worker, NATS, chat, sites)
---
# The regression runner: below every other pod, it waits for room instead of taking it. When the node runs short of
# memory the kubelet evicts pods over their request first, then by priority, so a runner over its request goes first.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: titan-regression
value: -10
globalDefault: false
preemptionPolicy: Never
description: The regression runner, which yields to every other pod
