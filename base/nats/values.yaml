# titan-ops architecture/money-and-wallet.md#single-writer-outbox S3 — NATS core for the wallet-mutation notify bus.
#
# NATS core for the wallet bus: a NOTIFY layer only. The durable queue is the DB (wallet_mutations); a message lost
# while the subscriber is down is a delayed apply, never lost money, because the command is durable and the sweeper (S6)
# re-drives it. JetStream is on in memory only, with no file store and no volume, for one thing: the chat assistant's
# daily cap bucket (titan-ops features/public-site/design.md#chat-assistant). A NATS restart empties it, and the cap
# starts again from zero (OD-2).
#
# Single server, no cluster. Every control plane pod subscribes and receives every notify; the consumer's row locks
# make the applies of one wallet take turns.
config:
  jetstream:
    enabled: true
    fileStore:
      enabled: false
    # Below the container's memory limit; the chat bucket is capped at 8 MiB of it.
    memoryStore:
      enabled: true
      maxSize: 32Mi
  cluster:
    enabled: false

# One pod is enough for a notify-only bus at this scale (~1000–5000 VM, low mutation frequency).
container:
  merge:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

podTemplate:
  merge:
    spec:
      priorityClassName: titan-platform

# No monitoring sidecar / reloader needed for iteration 1; keep the footprint small.
natsBox:
  enabled: false
reloader:
  enabled: false
promExporter:
  enabled: false
