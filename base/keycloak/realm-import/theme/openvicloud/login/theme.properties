# OpenViCloud login theme (titan-ops architecture/platform-infra.md#keycloak-theme).
# Only template.ftl is overridden; every page keeps the form and ids of keycloak.v2/base.
parent=keycloak.v2

# A child styles= replaces the parent list, so keycloak.v2's own sheet is listed again.
styles=css/styles.css css/openvicloud.css

# The child lists every locale it offers; the parent list is replaced, not merged.
locales=en,vi

# Appended to the theme's stylesheet and favicon URLs: Keycloak lets browsers keep static files for 30 days under an
# unchanged URL. Value: python3 scripts/keycloak-theme.py --print
ovcAssetsVersion=69f7563adc0b
