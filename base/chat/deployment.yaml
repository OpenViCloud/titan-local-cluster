apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
spec:
  # No replicas: hpa.yaml owns the count. Every pod counts the daily answer cap of each visitor address in one NATS KV
  # bucket, so pods share it (titan-ops features/public-site/design.md#chat-assistant).
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      priorityClassName: titan-platform
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: chat
          image: chat:latest
          ports:
            - containerPort: 8080
          env:
            # The prices the assistant quotes: the control plane's anonymous offering routes, in the same namespace.
            - name: API_BASE_URL
              value: http://control-plane
            # The NATS of the wallet notify bus, with JetStream on in memory for the cap's bucket (base/nats/values.yaml).
            - name: NATS_URL
              value: nats://nats.titan-nats.svc.cluster.local:4222
          # OPENROUTER_API_KEY and DATABASE_URL.
          envFrom:
            - secretRef:
                name: landing-chat-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          # One pod uses about 80 MiB (measured on dev 2026-11-12).
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 192Mi
