# The control plane's background jobs (titan-ops architecture/background-jobs.md#background-jobs): each CronJob calls
# POST /internal/jobs/{job} and waits for the pass, so one control plane pod runs each pass however many pods there are.
# Forbid: a pass still running when the next is due skips that one. A curl that hangs ends at --max-time, its Job at
# activeDeadlineSeconds. startingDeadlineSeconds: even the most recent missed run is skipped when it cannot start within
# 120 s of its schedule (a machine that slept waits for the next one). No ttlSecondsAfterFinished: the history limits
# keep the last failed Jobs readable with kubectl get jobs.
# The hourly ones run at different minutes so they do not start together.
---
# Every meter's tick (BillingMeter:IntervalMinutes, default 10): one usage record per resource per bucket, so a second pass in a bucket bills nothing more. Dev patches it to every minute.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: control-plane-job-meter
spec:
  schedule: "*/10 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          priorityClassName: titan-platform
          containers:
            - name: trigger
              image: curlimages/curl:8.11.0
              env:
                - name: INTERNAL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: control-plane-secrets
                      key: Internal__Token
              command:
                - sh
                - -c
                - >
                  curl --fail-with-body -sS --max-time 540 -X POST
                  http://control-plane/internal/jobs/meter
                  -H "X-Internal-Token: $INTERNAL_TOKEN"
                  -H "Content-Type: application/json"
                  -d '{}'
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
---
