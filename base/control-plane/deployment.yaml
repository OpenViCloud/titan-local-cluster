apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  # At least two pods, one at a time, none leaving before its replacement is ready
  # (titan-ops architecture/platform-infra.md#control-plane-replicas). No replicas here: the HPA in hpa.yaml owns the
  # count, two to four, and a count in git would put ArgoCD and the HPA at odds. Every pod runs the wallet subscriber
  # and sweeper: the consumer's row locks make the applies of one wallet take turns
  # (titan-ops architecture/money-and-wallet.md#single-writer-outbox).
  #
  # A rolling update serves the old and the new version at once until the last old pod stops. A release that changes
  # how money is guarded (titan-ops architecture/money-and-wallet.md#confirmed-topup-is-receipt is a worked example of
  # two versions whose guards cannot see each other) deploys with Recreate instead, by a patch that an overlay adds
  # (titan-ops architecture/platform-infra.md#control-plane-replicas says which).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      # The preStop sleep lets the Service drop the pod before it stops taking requests; the rest of the grace period
      # is for requests in flight. Open SSH sessions are cut when the pod stops.
      terminationGracePeriodSeconds: 45
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: control-plane
          image: control-plane:latest
          ports:
            - containerPort: 8080
            - name: metrics
              containerPort: 9464
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          envFrom:
            - secretRef:
                name: control-plane-secrets
          # Readiness only: /healthz checks the database, so as a liveness probe it would restart-loop the pod for as long as
          # the database is down.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
