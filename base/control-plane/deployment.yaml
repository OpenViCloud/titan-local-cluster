apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  replicas: 1
  # Recreate, not RollingUpdate. The default surges a new pod to Ready BEFORE the old one is
  # terminated, so for a moment two versions of the control-plane serve at once — and this service is
  # the sole writer to the billing database.
  #
  # That overlap is only survivable while both versions agree on how a write is guarded. titan-ops architecture/money-and-wallet.md#confirmed-topup-is-receipt is a
  # worked example of them not agreeing: the old code stopped a double credit with a unique index on
  # receipts, the new code stops it with `WHERE status = 'Pending'` inside the claim. Neither guard can
  # see the other, so a top-up confirmed by the new pod could be confirmed AGAIN by the old one, and
  # the customer's wallet would be credited twice with nothing to detect it.
  #
  # The cost is a few seconds of 503 per deploy. At replicas: 1 there is no high availability to
  # protect anyway — RollingUpdate was buying a zero-downtime deploy, not resilience, and paying for it
  # with a window where two writers race on money. This also closes Q-R1, open since titan-ops architecture/money-and-wallet.md#wallet-one-balance, rather
  # than patching one deploy and leaving the next one exposed.
  #
  # titan-ops architecture/money-and-wallet.md#single-writer-outbox (2026-09-21) now leans on BOTH lines above, so neither is free to change casually:
  #   • replicas: 1 IS the single-writer guarantee (OD-3). The wallet-mutation subscriber and the
  #     sweeper both run in this pod; a second replica means two writers per wallet. Correctness would
  #     still hold — FOR UPDATE SKIP LOCKED, the wallet version token and command idempotency are all
  #     layered underneath — but the design's central property would be gone, and scaling out needs the
  #     consistent-hash partitioning parked in the backlog (owner Athena), not just a higher number.
  #   • Recreate keeps two sweepers from overlapping during a deploy, the same overlap the paragraph
  #     above describes for request writers.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: control-plane
          image: control-plane:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: control-plane-secrets
          # Readiness only: /healthz checks the database, so as a liveness probe it would restart-loop the pod for as long as
          # the database is down.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
