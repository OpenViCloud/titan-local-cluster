# Two to four control plane pods by CPU against the request (titan-ops architecture/platform-infra.md#control-plane-replicas);
# four pods at a Postgres pool of 40 each fit under titan-db's max_connections.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: control-plane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: control-plane
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
