apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace: each environment puts the runner in its Keycloak namespace, where the two test-account secrets live, and
# generates ConfigMap regression-runner-urls (PORTAL_BASE_URL, ADMIN_BASE_URL, API_BASE_URL) with its public addresses.

resources:
  - runner-configmap.yaml
  - cronjob.yaml
  - cronjob-lane-b.yaml
