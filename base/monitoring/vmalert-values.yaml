# vmalert evaluates five alerts (node memory, node disk, pod restarts, control plane 5xx, Postgres) on VictoriaMetrics
# and hands them to the Alertmanager this chart runs.
# The receiver here sends nowhere; an environment that sends (Discord) gives Alertmanager its own config Secret.
server:
  fullnameOverride: vmalert
  datasource:
    url: http://victoria-metrics.monitoring.svc:8428
  notifier:
    url: http://alertmanager.monitoring.svc:9093
  extraArgs:
    envflag.enable: true
    envflag.prefix: VM_
    loggerFormat: json
    evaluationInterval: 30s
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi
  config:
    alerts:
      groups:
        - name: titan
          rules:
            - alert: NodeMemoryHigh
              expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.85
              for: 5m
              annotations:
                summary: "Node {{ $labels.node }} uses more than 85% of its memory"
            # The node's root filesystem, not a PVC: local-path enforces no PVC size, so every volume shares it. Above
            # the kubelet's image clean-up threshold (85%): firing means the clean-up ran and was not enough.
            - alert: NodeDiskFull
              expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.90
              for: 5m
              annotations:
                summary: "Node {{ $labels.node }} root filesystem is more than 90% full"
            # increase() of VictoriaMetrics counts the first value of a series it has just seen as an increase, so a
            # pod that restarted days ago fires as soon as scraping begins; increase_prometheus() does not.
            - alert: PodRestarting
              expr: increase_prometheus(kube_pod_container_status_restarts_total[10m]) > 3
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in 10 minutes"
            - alert: ControlPlane5xx
              expr: |
                sum(rate(http_requests_received_total{job="control-plane",code=~"5.."}[5m]))
                  / sum(rate(http_requests_received_total{job="control-plane"}[5m])) > 0.01
              annotations:
                summary: "Control plane answered more than 1% 5xx over 5 minutes"
            - alert: PostgresDown
              expr: max(cnpg_collector_up{cluster="titan-db"}) < 1 or absent(cnpg_collector_up{cluster="titan-db"})
              for: 30s
              annotations:
                summary: "Postgres titan-db does not answer"

alertmanager:
  enabled: true
  fullnameOverride: alertmanager
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi
  config:
    route:
      receiver: devnull
    receivers:
      - name: devnull
