apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak-staging
spec:
  # CNPG adopts the database when it already exists (a cluster made by initdb before this object, or one restored from a
  # backup), and makes it otherwise.
  name: keycloak_staging
  owner: titan
  cluster:
    name: titan-db
  # CNPG's defaults, written out: left implicit, ArgoCD diffs the defaulted live object against this and keeps the app
  # OutOfSync. retain: deleting this object never drops Keycloak's data.
  ensure: present
  databaseReclaimPolicy: retain
