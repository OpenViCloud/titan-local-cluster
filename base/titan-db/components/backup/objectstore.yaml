apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: titan-db-backup
spec:
  # Seven days. No bucket lock: barman rewrites backup.info, which a lock refuses (https://github.com/OpenViCloud/titan-ops/blob/main/docs/infra/oci/architecture.md#no-bucket-lock).
  retentionPolicy: "7d"
  configuration:
    # The bucket and its endpoint belong to the environment: every overlay that adds this component patches both. The
    # endpoint here is under .invalid (RFC 6761), so an overlay that forgets fails to archive (ContinuousArchiving=False,
    # WAL piling up on the PVC) rather than writing into another environment's bucket.
    destinationPath: s3://set-by-the-overlay/postgres/
    endpointURL: https://set-by-the-overlay.invalid
    s3Credentials:
      accessKeyId:
        name: titan-db-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: titan-db-backup-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
