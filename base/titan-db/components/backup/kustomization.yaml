apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Continuous backup of titan-db to R2 through the Barman Cloud Plugin: WAL archiving, a daily base backup, 7 days kept
# (titan-ops infra/oci/architecture.md#backup-bucket). The bucket here is a placeholder: every overlay that
# adds this component patches the bucket and its endpoint (dev: gitops/titan-db/). An overlay adds it only once the Secret
# titan-db-backup-credentials exists, or WAL cannot leave the node and piles up on the PVC (titan-ops infra/oci/runbook.md#backup-enable).
resources:
  - objectstore.yaml
  - scheduled-backup.yaml

patches:
  - target:
      kind: Cluster
      name: titan-db
    patch: |-
      - op: add
        path: /spec/plugins
        value:
          # enabled is CNPG's default, written out: left implicit, ArgoCD diffs the defaulted live Cluster against this and
          # keeps the app OutOfSync.
          - name: barman-cloud.cloudnative-pg.io
            enabled: true
            isWALArchiver: true
            parameters:
              barmanObjectName: titan-db-backup
