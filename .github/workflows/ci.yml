name: CI

# The pull script, the render of dev's overlays, the Keycloak theme and the provisioning tests of the Incus VM. The
# sweeper comparison reads OpenViCloud/titan-ops, which is private and which CI does not read; it runs before every push
# on a machine that can read it (README, Tests).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull script
        run: python3 tests/test_pull_images.py

      # kubectl and ruby come with the runner image.
      - name: Render of dev's overlays
        run: python3 tests/render_test.py

      - name: Keycloak theme
        run: python3 tests/test_keycloak_theme.py && python3 scripts/keycloak-theme.py --check

      - name: Guest-log sweeper
        run: bash mac/tests/incus-log-sweeper_test.sh

      - name: OVN uplink
        run: bash mac/tests/incus-uplink_test.sh
