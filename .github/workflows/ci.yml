name: CI

# The pull script and the provisioning tests of the Incus VM. The render of dev's overlays and the sweeper comparison
# read OpenViCloud/titan-ops, which is private and which CI does not read; they run before every push on a machine
# that can read it (README, Tests).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull script
        run: python3 tests/test_pull_images.py

      - name: Guest-log sweeper
        run: bash mac/tests/incus-log-sweeper_test.sh

      - name: OVN uplink
        run: bash mac/tests/incus-uplink_test.sh
