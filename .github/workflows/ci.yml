name: CI

# The Lima VM files of both OSes with host-os.sh, the cluster join, the host-port check and the first-start wait of up.sh, the pull script, the render of dev's overlays, the Keycloak theme and the provisioning tests of the Incus VM. The
# sweeper comparison reads OpenViCloud/titan-ops, which is private and which CI does not read; it runs before every push
# on a machine that can read it (README, Tests).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # titan-ops is private, so a link into it is a 404 for every reader of this repository; a titan-ops doc is named
      # `titan-ops <path under its docs/>#<anchor>` instead.
      - name: No URL into private titan-ops
        run: |
          if git grep -n -I -i -E 'github\.com/openvicloud/titan-ops([^[:alnum:]_-]|$)' -- ':/'; then
            echo "URL into private titan-ops above: write titan-ops <path>#<anchor>"; exit 1
          fi

      # kubectl and ruby come with the runner image.
      - name: Lima files of macOS and Ubuntu, host-os.sh
        run: python3 tests/test_lima_files.py

      - name: Pull script
        run: python3 tests/test_pull_images.py

      - name: Render of dev's overlays
        run: python3 tests/render_test.py

      - name: Keycloak theme
        run: python3 tests/test_keycloak_theme.py && python3 scripts/keycloak-theme.py --check

      - name: Guest-log sweeper
        run: bash lima/tests/incus-log-sweeper_test.sh

      - name: OVN uplink
        run: bash lima/tests/incus-uplink_test.sh

      - name: S3 CA on titan-incus
        run: bash lima/tests/trust-s3-ca_test.sh

      - name: Cluster join
        run: bash lima/tests/join-cluster_test.sh

      - name: Old Applications dropped
        run: bash lima/tests/drop-old-applications_test.sh

      - name: Host ports free before a VM starts
        run: bash lima/tests/ports-free_test.sh

      - name: First start outlasts Lima's wait
        run: bash lima/tests/first-start_test.sh
